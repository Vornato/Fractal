<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love In Georgia | Tbilisi Nightlife & Event Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070509;
      --bg-2: #110815;
      --panel: rgba(15, 11, 18, 0.82);
      --panel-2: rgba(23, 15, 25, 0.92);
      --card: rgba(255, 255, 255, 0.045);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f9f2f7;
      --muted: rgba(249, 242, 247, 0.7);
      --pink: #ff4d9d;
      --pink-soft: #ffb4d2;
      --gold: #ffb15d;
      --lime: #d9ff74;
      --cyan: #64f7ff;
      --red: #ff365d;
      --violet: #7d4dff;
      --shadow: 0 32px 100px rgba(0, 0, 0, 0.45);
      --cut: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
      --content: 1240px;
      --font-body: "Manrope", "Noto Sans Georgian", sans-serif;
      --font-display: "Bebas Neue", "Noto Sans Georgian", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 6.5rem;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(circle at 12% 14%, rgba(255, 54, 93, 0.22), transparent 27%),
        radial-gradient(circle at 84% 8%, rgba(100, 247, 255, 0.16), transparent 24%),
        radial-gradient(circle at 70% 64%, rgba(255, 77, 157, 0.16), transparent 30%),
        linear-gradient(180deg, #050307 0%, #120712 42%, #060306 100%);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(104deg, rgba(255, 54, 93, 0.12), transparent 34%),
        linear-gradient(287deg, rgba(100, 247, 255, 0.1), transparent 32%),
        linear-gradient(180deg, transparent 0%, rgba(255, 177, 93, 0.06) 54%, transparent 100%);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.26) 0 1px, transparent 1.5px),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 26px 26px, 48px 48px, 48px 48px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 88%);
      z-index: -1;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
    }

    .shell {
      position: relative;
      isolation: isolate;
    }

    .shell::before,
    .shell::after {
      content: "";
      position: fixed;
      inset: -18%;
      pointer-events: none;
      z-index: -3;
    }

    .shell::before {
      background:
        conic-gradient(from 215deg at 50% 50%, transparent 0 13%, rgba(255, 54, 93, 0.18) 16%, transparent 20% 45%, rgba(100, 247, 255, 0.13) 49%, transparent 53% 76%, rgba(255, 177, 93, 0.13) 80%, transparent 86% 100%);
      mix-blend-mode: screen;
      opacity: 0.72;
      animation: clubSweep 24s linear infinite;
    }

    .shell::after {
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0 48%, rgba(255, 77, 157, 0.14) 50%, transparent 52% 100%),
        linear-gradient(180deg, transparent 0 48%, rgba(100, 247, 255, 0.08) 50%, transparent 52% 100%);
      background-size: 13rem 13rem;
      mask-image: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.55) 20%, transparent 80%);
      opacity: 0.22;
    }

    @keyframes clubSweep {
      to {
        transform: rotate(360deg);
      }
    }

    .glow {
      position: fixed;
      width: 28rem;
      height: 28rem;
      border-radius: 50%;
      filter: blur(26px);
      opacity: 0.35;
      pointer-events: none;
      z-index: -1;
    }

    .glow.one {
      top: 9%;
      left: -10%;
      background: radial-gradient(circle, rgba(255, 77, 157, 0.42), transparent 68%);
    }

    .glow.two {
      bottom: 6%;
      right: -10%;
      background: radial-gradient(circle, rgba(255, 177, 93, 0.34), transparent 68%);
    }

    .container {
      width: min(var(--content), calc(100% - 2rem));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(18px);
      background:
        linear-gradient(90deg, rgba(255, 54, 93, 0.08), transparent 34%, rgba(100, 247, 255, 0.07)),
        rgba(6, 3, 8, 0.82);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
    }

    .topbar-inner {
      width: min(var(--content), calc(100% - 2rem));
      margin: 0 auto;
      min-height: 5.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.95rem;
      text-decoration: none;
      min-width: 0;
    }

    .brand img {
      width: 3.7rem;
      height: 3.7rem;
      object-fit: cover;
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 0 28px rgba(255, 77, 157, 0.28),
        0 0 48px rgba(100, 247, 255, 0.08);
      flex: 0 0 auto;
    }

    .brand-copy {
      min-width: 0;
      display: grid;
      gap: 0.12rem;
    }

    .brand-copy strong {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 1.9vw, 1.7rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1;
      font-weight: 400;
    }

    .brand-copy span {
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav a {
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(249, 242, 247, 0.82);
      transition: color 0.22s ease;
    }

    .nav a:hover {
      color: var(--pink-soft);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip,
    .lang-switch button,
    .icon-link,
    .ghost-link {
      min-height: 2.75rem;
      padding: 0.72rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      text-decoration: none;
      font: inherit;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease;
    }

    .lang-switch {
      display: inline-flex;
      gap: 0.25rem;
      padding: 0.24rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
    }

    .lang-switch button {
      min-height: 2.3rem;
      padding-inline: 0.9rem;
      border: 0;
      background: transparent;
    }

    .lang-switch button.active {
      background: linear-gradient(135deg, var(--red), var(--pink), var(--gold));
      color: #12070f;
      box-shadow: 0 0 22px rgba(255, 77, 157, 0.34);
    }

    .chip.hidden,
    .ghost-link.hidden {
      display: none;
    }

    .hero {
      padding: clamp(4rem, 7vw, 6.5rem) 0 clamp(3rem, 6vw, 5rem);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.98fr) minmax(320px, 0.72fr);
      gap: clamp(1.6rem, 3vw, 3rem);
      align-items: center;
    }

    .hero-copy,
    .hero-rail,
    .feature-panel,
    .event-card,
    .venue-card,
    .booking-copy,
    .booking-card,
    .footer-panel {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      clip-path: var(--cut);
      overflow: hidden;
    }

    .hero-copy,
    .booking-copy,
    .booking-card,
    .footer-panel {
      background:
        radial-gradient(circle at 72% 16%, rgba(100, 247, 255, 0.12), transparent 28%),
        linear-gradient(135deg, rgba(255, 54, 93, 0.14), transparent 42%),
        linear-gradient(315deg, rgba(255, 177, 93, 0.1), transparent 38%),
        var(--panel-2);
    }

    .hero-copy {
      min-height: min(74vh, 34rem);
      padding: clamp(1.6rem, 3vw, 2.5rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-copy::before {
      content: "";
      position: absolute;
      inset: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      clip-path: var(--cut);
      pointer-events: none;
    }

    .hero-copy::after {
      content: "DANCEFLOOR / DRINKS / BOOKING";
      position: absolute;
      top: 2rem;
      right: -1.2rem;
      writing-mode: vertical-rl;
      color: rgba(100, 247, 255, 0.38);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .hero-copy > * {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      color: rgba(249, 242, 247, 0.78);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin: 0 0 1rem;
    }

    .eyebrow::before {
      content: "";
      width: 2.6rem;
      height: 1px;
      background: linear-gradient(90deg, var(--pink), rgba(255, 177, 93, 0.5));
    }

    .hero-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 5.6vw, 5.8rem);
      line-height: 0.94;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      max-width: 11ch;
      text-wrap: balance;
    }

    .hero-title span {
      display: block;
      background: linear-gradient(92deg, var(--pink-soft), var(--red) 48%, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 34px rgba(255, 77, 157, 0.24);
    }

    .hero-lead {
      max-width: 34rem;
      margin: 1.2rem 0 0;
      font-size: 1rem;
      line-height: 1.55;
      color: rgba(249, 242, 247, 0.88);
    }

    .hero-actions {
      margin-top: 1.7rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      min-height: 3.2rem;
      padding: 0.95rem 1.3rem;
      clip-path: var(--cut);
      border: 1px solid transparent;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .cta:hover,
    .chip:hover,
    .icon-link:hover,
    .ghost-link:hover {
      transform: translateY(-2px);
    }

    .cta.primary {
      background: linear-gradient(110deg, var(--red), var(--pink) 45%, var(--gold));
      color: #140912;
      box-shadow:
        0 18px 34px rgba(255, 77, 157, 0.28),
        0 0 30px rgba(255, 177, 93, 0.14);
    }

    .cta.secondary {
      border-color: rgba(255, 255, 255, 0.14);
      background:
        linear-gradient(135deg, rgba(100, 247, 255, 0.07), transparent 48%),
        rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .hero-rail {
      min-height: min(74vh, 34rem);
      padding: clamp(0.85rem, 1.6vw, 1.25rem);
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 74% 16%, rgba(255, 177, 93, 0.18), transparent 28%),
        radial-gradient(circle at 18% 74%, rgba(255, 54, 93, 0.2), transparent 32%),
        linear-gradient(180deg, rgba(100, 247, 255, 0.08), rgba(11, 8, 12, 0.96)),
        var(--panel-2);
    }

    .hero-rail::after {
      content: "";
      position: absolute;
      inset: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      clip-path: var(--cut);
      pointer-events: none;
      z-index: 2;
    }

    .hero-rail::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 26% 18%, rgba(255, 77, 157, 0.22), transparent 30%),
        radial-gradient(circle at 84% 78%, rgba(100, 247, 255, 0.16), transparent 34%);
      pointer-events: none;
    }

    .hero-rail .poster-card {
      width: min(100%, 31rem);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    .poster-card {
      position: relative;
      z-index: 1;
      min-height: 0;
      height: auto;
      aspect-ratio: 1 / 1;
      clip-path: var(--cut);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      background: #140d16;
    }

    .poster-card:nth-child(1) {
      grid-area: auto;
    }

    .poster-card:nth-child(2) {
      grid-area: auto;
    }

    .poster-card:nth-child(3) {
      grid-area: auto;
    }

    .poster-card:nth-child(n + 4) {
      display: none;
    }

    .poster-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      filter: saturate(1.08) contrast(1.04);
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 77, 157, 0.14), transparent 28%),
        radial-gradient(circle at 84% 16%, rgba(255, 177, 93, 0.12), transparent 32%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(9, 6, 11, 0.2));
    }

    .poster-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 0%, rgba(8, 5, 10, 0.08) 36%, rgba(8, 5, 10, 0.9) 100%);
    }

    .poster-copy {
      position: absolute;
      inset: auto 0 0 0;
      padding: 0.9rem;
      z-index: 1;
      display: grid;
      gap: 0.3rem;
      background: linear-gradient(180deg, transparent, rgba(5, 3, 7, 0.78));
    }

    .poster-copy strong {
      display: block;
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 1.6vw, 1.75rem);
      text-transform: uppercase;
      line-height: 0.9;
      letter-spacing: 0.04em;
      max-width: 10ch;
      text-wrap: balance;
    }

    .poster-copy span,
    .poster-copy small {
      display: block;
      color: rgba(249, 242, 247, 0.72);
      font-size: 0.64rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      line-height: 1.35;
    }

    .poster-copy span {
      max-width: 26ch;
    }

    .poster-card:nth-child(1) .poster-copy {
      padding: 1.15rem;
    }

    .poster-card:nth-child(1) .poster-copy strong {
      font-size: clamp(1.3rem, 1.6vw, 1.75rem);
      max-width: 10ch;
    }

    .poster-card:nth-child(1) .poster-copy span,
    .poster-card:nth-child(1) .poster-copy small {
      font-size: 0.72rem;
    }

    .section {
      padding: clamp(4.6rem, 8vw, 8rem) 0 0;
      scroll-margin-top: 6.5rem;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: clamp(1.5rem, 3vw, 2.4rem);
      flex-wrap: wrap;
    }

    .section-head h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 3.45vw, 3.55rem);
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: 0.035em;
      max-width: 16ch;
    }

    .section-head p {
      margin: 0;
      max-width: 34rem;
      color: var(--muted);
    }

    .feature-panel {
      display: grid;
      grid-template-columns: minmax(280px, 0.82fr) minmax(0, 1.18fr);
      gap: clamp(1.4rem, 3vw, 2.6rem);
      padding: clamp(1rem, 2vw, 1.5rem);
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 54, 93, 0.18), transparent 34%),
        radial-gradient(circle at 82% 72%, rgba(100, 247, 255, 0.12), transparent 30%),
        linear-gradient(315deg, rgba(255, 77, 157, 0.12), transparent 36%),
        var(--panel-2);
    }

    .feature-poster {
      position: relative;
      aspect-ratio: 1 / 1;
      clip-path: var(--cut);
      overflow: hidden;
      background: #120a13;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .feature-poster img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 77, 157, 0.14), transparent 28%),
        radial-gradient(circle at 84% 18%, rgba(255, 177, 93, 0.12), transparent 30%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(8, 5, 10, 0.18));
    }

    .feature-poster::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 12%, rgba(8, 5, 10, 0.08) 56%, rgba(8, 5, 10, 0.82) 100%),
        linear-gradient(90deg, rgba(255, 54, 93, 0.18), transparent 40%, rgba(100, 247, 255, 0.12));
      mix-blend-mode: screen;
    }

    .feature-stamp {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 1;
      padding: 0.7rem 0.85rem;
      clip-path: var(--cut);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(8, 5, 10, 0.6);
      color: rgba(249, 242, 247, 0.86);
      font-size: 0.76rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .feature-copy {
      padding: 0.4rem 0.2rem;
      display: grid;
      gap: 1rem;
      align-content: start;
    }

    .feature-copy h3 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 3.6vw, 3.7rem);
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.035em;
      max-width: 12ch;
    }

    .feature-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .feature-meta span {
      padding: 0.55rem 0.8rem;
      clip-path: var(--cut);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(249, 242, 247, 0.76);
    }

    .feature-copy p {
      margin: 0;
      color: rgba(249, 242, 247, 0.85);
      max-width: 44rem;
    }

    .feature-facts,
    .pricing-grid,
    .venue-grid,
    .past-grid {
      display: grid;
      gap: 0.9rem;
    }

    .feature-facts {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .fact {
      padding: 1rem;
      clip-path: var(--cut);
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .fact strong {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(249, 242, 247, 0.62);
      margin-bottom: 0.45rem;
    }

    .fact span {
      color: rgba(249, 242, 247, 0.86);
      font-size: 0.95rem;
    }

    .pricing-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .price-card {
      padding: 0.9rem;
      clip-path: var(--cut);
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .price-card strong {
      display: block;
      font-family: var(--font-display);
      font-size: 1.05rem;
      text-transform: uppercase;
    }

    .price-card span {
      display: block;
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 0.3rem;
    }

    .past-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .archive-poster-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      margin: 0 0 clamp(1.9rem, 3.4vw, 3rem);
    }

    .archive-poster-card {
      position: relative;
      min-height: 0;
      aspect-ratio: 1 / 1;
      clip-path: var(--cut);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      background: #140d16;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
    }

    .archive-poster-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;

    function getInitialLanguage() {
      const params = new URLSearchParams(window.location.search);
      const fromQuery = params.get("lang");
      if (fromQuery === "en" || fromQuery === "ka") return fromQuery;
      const stored = window.localStorage.getItem("lig-language");
      return stored === "ka" ? "ka" : "en";
    }

    function normalizeSettings(raw) {
      const brandContent = raw.brand_content || {};
      const featuredEvent = {
        ...fallbackSettings.brand_content.featured_event,
        ...(brandContent.featured_event || {})
      };
      const posterItems = (Array.isArray(brandContent.poster_items) && brandContent.poster_items.length
        ? brandContent.poster_items
        : fallbackSettings.brand_content.poster_items
      ).map((item, index) => ({
        ...(fallbackSettings.brand_content.poster_items[index] || fallbackSettings.brand_content.poster_items[0]),
        ...item
      }));

      return {
        ...fallbackSettings,
        ...raw,
        ticket_categories: Array.isArray(raw.ticket_categories) && raw.ticket_categories.length ? raw.ticket_categories : fallbackSettings.ticket_categories,
        allowed_tiers: Array.isArray(raw.allowed_tiers) && raw.allowed_tiers.length ? raw.allowed_tiers : fallbackSettings.allowed_tiers,
        brand_content: {
          ...fallbackSettings.brand_content,
          ...brandContent,
          featured_event: featuredEvent,
          poster_items: posterItems
        }
      };
    }

    function currentCopy() {
      return content[state.lang];
    }

    function localize(enValue, kaValue) {
      if (state.lang === "ka") return kaValue || enValue || "";
      return enValue || kaValue || "";
    }

    function resolveMedia(path) {
      if (!path) return "poster-placeholder.svg";
      if (/^https?:\/\//i.test(path)) return path;
      if (path.startsWith("/uploads/")) return `${API_BASE}${path}`;
      return path;
    }

    function getFeatured() {
      const settings = state.settings;
      const featured = settings.brand_content.featured_event || {};
      return {
        tag: localize(featured.tag_en || "Upcoming edition", featured.tag_ka || "მომავალი გამოცემა"),
        title: localize(settings.event_name, featured.title_ka || featured.title_en),
        date: localize(settings.event_date, featured.date_ka || featured.date_en),
        location: localize(settings.location, featured.location_ka || featured.location_en),
        summary: localize(settings.event_description, featured.summary_ka || featured.summary_en),
        bookingCopy: localize(settings.booking_description, featured.booking_copy_ka || featured.booking_copy_en),
        poster: resolveMedia(featured.poster_url)
      };
    }

    function getPosterItems() {
      return state.settings.brand_content.poster_items.map((item) => ({
        tag: localize(item.tag_en, item.tag_ka),
        title: localize(item.title_en, item.title_ka),
        meta: localize(item.meta_en, item.meta_ka),
        image: resolveMedia(item.image_url)
      }));
    }

    function getArchivePosterItems() {
      const featured = getFeatured();
      return [
        {
          tag: featured.tag,
          title: featured.title,
          meta: [featured.date, featured.location].filter(Boolean).join(" / "),
          image: featured.poster
        },
        ...getPosterItems()
      ].filter((item) => item.image).slice(0, 4);
    }

    function getAvailableTiers() {
      const allowed = new Set(state.settings.allowed_tiers || []);
      const tiers = (state.settings.ticket_categories || fallbackSettings.ticket_categories).filter((item) => {
        return !item.id || allowed.size === 0 || allowed.has(item.id);
      });
      return tiers.length ? tiers : fallbackSettings.ticket_categories;
    }

    function getPaymentModes() {
      const labels = currentCopy().booking.methods;

    function renderHeader() {
      const copy = currentCopy();
      const loginLabel = state.lang === "ka" ? "შესვლა" : "Login";

      elements.navFeatured.textContent = copy.nav.featured;
      elements.navArchive.textContent = copy.nav.archive;

      elements.navBooking.textContent = copy.nav.booking;

      elements.profileLink.textContent = accountLabel;

      elements.profileLink.classList.toggle("hidden", !state.user);

      elements.userBadge.textContent = state.user ? (state.user.name || state.user.email || "Member") : "";

      elements.languageButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === state.lang);
      });
    }

    function renderPaymentRail() {
      const copy = currentCopy();
      const lines = [];
      const transferNote = localize(state.settings.transfer_note, state.settings.transfer_note_ka || "გადარიცხვის დანიშნულებაში მიუთითე სახელი და გვარი, რომ დაჯავშნა სწრაფად დადასტურდეს.");
      if (state.settings.tbc_account) lines.push(`TBC: ${state.settings.tbc_account}`);
      if (state.settings.bog_account) lines.push(`Bank of Georgia: ${state.settings.bog_account}`);
      if (transferNote) lines.push(transferNote);
      if (state.settings.qr_url) lines.push(state.settings.qr_url);

      elements.paymentLabel.textContent = copy.booking.paymentLabel;
      elements.paymentLines.innerHTML = lines.length
        ? lines.map((line) => `<span>${line}</span>`).join("")
        : `<span>${copy.booking.paymentMissing}</span>`;
    }

    function renderBookingForm() {
      const copy = currentCopy();
      const loginLabel = state.lang === "ka" ? "შესვლა" : "Login";
      const registerLabel = state.lang === "ka" ? "რეგისტრაცია" : "Register";
      const featured = getFeatured();
      const tiers = getAvailableTiers();

      elements.bookingEyebrow.textContent = copy.booking.eyebrow;

      elements.bookingIntro.textContent = copy.booking.intro;
      elements.bookingLoginLink.textContent = loginLabel;
      elements.bookingRegisterLink.textContent = registerLabel;
      elements.bookingSocialLink.textContent = copy.booking.socialLink;
      elements.formEyebrow.textContent = copy.booking.formEyebrow;
      elements.formHeading.textContent = copy.booking.formHeading;
      elements.gateTitle.textContent = copy.booking.gateTitle;
      elements.gateCopy.textContent = copy.booking.gateCopy;
      elements.gateLoginLink.textContent = loginLabel;
      elements.gateRegisterLink.textContent = registerLabel;
      elements.paymentDetailTitle.textContent = copy.booking.paymentDetailTitle;
      elements.submitButton.textContent = copy.booking.submit;

      elements.labelEvent.textContent = copy.booking.labels.event;
      elements.labelName.textContent = copy.booking.labels.name;
      elements.labelEmail.textContent = copy.booking.labels.email;
      elements.labelPhone.textContent = copy.booking.labels.phone;
      elements.labelGuests.textContent = copy.booking.labels.guests;
      elements.labelTier.textContent = copy.booking.labels.tier;
      elements.labelPaymentMethod.textContent = copy.booking.labels.payment;
      elements.labelPaymentId.textContent = copy.booking.labels.paymentId;

      elements.selectedEvent.value = featured.title;

      elements.tierSelect.innerHTML = tiers.map((tier) => `
        <option value="${tier.label}">${tier.label}${tier.price ? ` | ${tier.price}` : ""}</option>
      `).join("");

      elements.paymentSelect.innerHTML = paymentModes.map((mode) => `
        <option value="${mode.label}">${mode.label}</option>
      `).join("");

      if (state.user) {
        elements.nameInput.value = state.user.name || "";
        elements.emailInput.value = state.user.email || "";
        elements.phoneInput.value = state.user.phone || "";
      }

      elements.bookingGate.classList.toggle("hidden", !!state.user);
      elements.bookingForm.classList.toggle("hidden", !state.user);
      renderPaymentDetails();
    }

    function renderPaymentDetails() {
      const selected = elements.paymentSelect.value;
      const lines = [];
      const transferNote = localize(state.settings.transfer_note, state.settings.transfer_note_ka || "გადარიცხვის დანიშნულებაში მიუთითე სახელი და გვარი, რომ დაჯავშნა სწრაფად დადასტურდეს.");
      if (selected.includes("QR") && state.settings.qr_url) {
        lines.push(state.settings.qr_url);
      } else if (selected.includes("Bank") || selected.includes("ბანკ")) {
        if (state.settings.tbc_account) lines.push(`TBC: ${state.settings.tbc_account}`);
        if (state.settings.bog_account) lines.push(`Bank of Georgia: ${state.settings.bog_account}`);
      } else {
        lines.push(transferNote || currentCopy().booking.paymentMissing);
      }
      if (transferNote && !lines.includes(transferNote)) {
        lines.push(transferNote);
      }
      elements.paymentDetailLines.innerHTML = lines.map((line) => `<span>${line}</span>`).join("");
    }

    function renderFooter() {
      const copy = currentCopy();
      const loginLabel = state.lang === "ka" ? "შესვლა" : "Login";
      const registerLabel = state.lang === "ka" ? "რეგისტრაცია" : "Register";
      elements.footerEyebrow.textContent = copy.footer.eyebrow;
      elements.footerHeading.textContent = copy.footer.heading;
      elements.footerCopy.textContent = copy.footer.copy;
      elements.footerBook.textContent = copy.footer.book;
      elements.footerLogin.textContent = loginLabel;
      elements.footerRegister.textContent = registerLabel;
      elements.footerInstagram.textContent = copy.footer.instagram;
      elements.footerLegal.textContent = copy.footer.legal;
    }

    function initScrollReveal() {
      const targets = Array.from(document.querySelectorAll([
        ".hero-copy",
        ".hero-rail",
        ".section-head",
        ".feature-panel",
        ".archive-poster-card",
        ".event-card",
        ".venue-card",
        ".booking-copy",
        ".booking-card",
        ".footer-panel"
      ].join(",")));

      targets.forEach((target, index) => {
        target.classList.add("reveal-target");
        if (!target.style.getPropertyValue("--reveal-delay")) {
          target.style.setProperty("--reveal-delay", `${Math.min((index % 6) * 70, 280)}ms`);
        }
      });

      if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        targets.forEach((target) => target.classList.add("in-view"));
        return;
      }

      if (revealObserver) revealObserver.disconnect();
      revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("in-view");
          observer.unobserve(entry.target);
        });
      }, {
        threshold: 0.14,
        rootMargin: "0px 0px -8% 0px"
      });

      targets.forEach((target) => {
        target.classList.remove("in-view");
        revealObserver.observe(target);
      });
    }

    function renderAll() {
      renderHeader();
      renderHero();
      renderFeatured();
      renderStaticSections();
      renderPaymentRail();
      renderBookingForm();
      renderFooter();
      initScrollReveal();
    }

    async function fetchCurrentUser() {
      try {
        const response = await fetch(`${API_BASE}/api/user/me`, { credentials: "include" });
        if (!response.ok) throw new Error("unauthorized");
        const data = await response.json();
        state.user = data.user || null;
      } catch (error) {
        state.user = null;
      }
    }

    async function fetchSettings() {
      try {
        const response = await fetch(`${API_BASE}/api/event-settings`, { credentials: "include" });
        if (!response.ok) throw new Error("settings");
        const data = await response.json();
        state.settings = normalizeSettings((data && data.settings) || {});
      } catch (error) {
        state.settings = normalizeSettings({});
      }
    }

    async function handleBookingSubmit(event) {
      event.preventDefault();
      const copy = currentCopy();
      elements.bookingMessage.textContent = "";

      if (!state.user) {
        elements.bookingMessage.textContent = copy.booking.loginFirst;
        return;
      }

      const payload = {
        language: state.lang,
        event_title: elements.selectedEvent.value.trim(),
        name: elements.nameInput.value.trim(),
        email: elements.emailInput.value.trim(),
        phone: elements.phoneInput.value.trim(),
        guests: elements.guestsInput.value,
        tier: elements.tierSelect.value,
        payment: elements.paymentSelect.value,
        payment_id: elements.paymentIdInput.value.trim()
      };

      try {
        const response = await fetch(`${API_BASE}/api/bookings`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error((data && data.error) || `Request failed (${response.status})`);
        }
        elements.bookingMessage.textContent = copy.booking.success;
        elements.paymentIdInput.value = "";
        elements.guestsInput.value = "1";
      } catch (error) {
        elements.bookingMessage.textContent = error.message || "Booking failed.";
      }
    }

    async function logout() {
      try {
        await fetch(`${API_BASE}/api/auth/logout`, {
          method: "POST",
          credentials: "include"
        });
      } catch (error) {
        /* ignore */
      }
      state.user = null;
      await fetchSettings();
      renderAll();
    }

    function setLanguage(language) {
      state.lang = language;
      window.localStorage.setItem("lig-language", language);
      const url = new URL(window.location.href);
      url.searchParams.set("lang", language);
      window.history.replaceState(null, "", url);
      renderAll();
    }

    elements.languageButtons.forEach((button) => {
      button.addEventListener("click", () => setLanguage(button.dataset.lang));
    });
    elements.paymentSelect.addEventListener("change", renderPaymentDetails);
    elements.bookingForm.addEventListener("submit", handleBookingSubmit);
    elements.logoutBtn.addEventListener("click", logout);

    (async function bootstrap() {
      renderAll();
      await Promise.allSettled([fetchCurrentUser(), fetchSettings()]);
      renderAll();
    })();
  </script>
